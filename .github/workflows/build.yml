name: Build PDF Word (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crear motor PDF a Word (pdf2docx)
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install pdf2docx pyinstaller
          .\.venv\Scripts\python -m PyInstaller --onefile --name pdf2docx-cli --noconfirm --distpath bin python\pdf2docx_cli.py
          Get-ChildItem bin

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Word-Facil-Windows
          path: dist/*.exe
