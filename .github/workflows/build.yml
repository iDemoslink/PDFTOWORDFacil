name: Build PDF Word (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['word-v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Word-Facil-Windows
          path: dist/*.exe
