<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF y Word Fácil</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--accent:#d9480f;--accent-t:#fff;--line:#e3e1da;--soft:#fbeee7}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--text:#f0eee8;--muted:#a09e96;--accent:#ff7a3d;--accent-t:#1a1a18;--line:#35342f;--soft:#33251d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tab{padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer}
.tab .ic{display:block;font-size:1.7rem;margin-bottom:2px}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.pane{display:none}.pane.on{display:block}
.pick{display:block;width:100%;padding:16px;border:2px dashed var(--accent);border-radius:14px;background:transparent;color:var(--accent);font-size:1.05rem;font-weight:600;cursor:pointer}
.fname{margin-top:10px;font-weight:600;word-break:break-all;min-height:1.4em}
label.q{display:block;margin:14px 0 6px;font-weight:600;font-size:.95rem}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.note{margin-top:8px;color:var(--muted);font-size:.85rem}
.go{margin-top:16px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-t);font-size:1.05rem;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.bar{height:8px;border-radius:6px;background:var(--line);margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{margin-top:12px;min-height:1.4em;font-size:.95rem;white-space:pre-wrap}
.msg.err{color:#c92a2a}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:.95rem;padding:0;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>PDF y Word Fácil</h1>
  <p class="sub">Todo en tu equipo, sin anuncios y sin internet :D</p>

  <div class="tabs" role="tablist">
    <button class="tab" id="t-w2p" role="tab" aria-selected="true"><span class="ic">📄</span>Word a PDF</button>
    <button class="tab" id="t-p2w" role="tab" aria-selected="false"><span class="ic">📝</span>PDF a Word (con OCR)</button>
  </div>

  <div class="card">
    <section class="pane on" id="p-w2p">
      <button class="pick" id="pick-w">+ Elige el documento de Word</button>
      <input type="file" id="in-w" accept=".docx,.doc,.odt,.rtf" hidden>
      <div class="fname" id="fn-w"></div>
      <label class="q" for="eng">Motor</label>
      <select id="eng">
        <option value="auto">Automático (LibreOffice si lo tienes)</option>
        <option value="basic">Básico (sin LibreOffice)</option>
      </select>
      <div class="note" id="eng-note"></div>
      <button class="go" id="go-w" disabled>Convertir a PDF</button>
    </section>

    <section class="pane" id="p-p2w">
      <button class="pick" id="pick-p">+ Elige el PDF</button>
      <input type="file" id="in-p" accept=".pdf,application/pdf" hidden>
      <div class="fname" id="fn-p"></div>
      <label class="q" for="ocr">Reconocer texto (OCR)</label>
      <select id="ocr">
        <option value="auto">Automático (solo en páginas escaneadas)</option>
        <option value="always">Siempre (todas las páginas)</option>
        <option value="never">Nunca (solo texto que ya trae el PDF)</option>
      </select>
      <label class="q" for="lang">Idioma del documento</label>
      <select id="lang">
        <option value="spa+eng">Español + Inglés</option>
        <option value="spa">Español</option>
        <option value="eng">Inglés</option>
      </select>
      <div class="note">Sale un Word editable con el texto y los títulos. Las tablas, columnas e imágenes no se conservan igual que en el original.</div>
      <button class="go" id="go-p" disabled>Convertir a Word</button>
    </section>

    <div class="bar" id="bar"><i id="bari"></i></div>
    <div class="msg" id="msg" role="status"></div>
    <button class="link" id="open" style="display:none">Mostrar en la carpeta</button>
  </div>
</main>

<script src="lib/pdf.min.js"></script>
<script src="lib/tesseract.min.js"></script>
<script src="lib/docx.iife.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
